<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>カブトガニの海</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: the drawing is the page; a thin caption above, two quiet controls below. */
:root{
  --bg:#eef1ee; --fg:#22302e; --muted:#5d6b68; --wall:#d9ddd8; --accent:#2f6f8f; --chip:#ffffff;
  --display:"Klee One","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#152022; --fg:#e7ece9; --muted:#9fb0ad; --wall:#0e1718; --accent:#7cc0de; --chip:#1f2d30; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#152022; --fg:#e7ece9; --muted:#9fb0ad; --wall:#0e1718; --accent:#7cc0de; --chip:#1f2d30; color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);padding-inline:16px;padding-block:20px 28px}
.wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:600;font-size:clamp(1.5rem,3.4vw,2.3rem);margin:0;text-wrap:balance;letter-spacing:.02em}
.sub{margin:0;color:var(--muted);font-size:.95rem}
.scroller{overflow-x:auto;overflow-y:hidden;background:var(--wall);border-radius:6px;padding:10px;-webkit-overflow-scrolling:touch}
.stage{position:relative;aspect-ratio:2576/932;width:max(100%,calc(min(58vh,460px)*2.764));max-width:none;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.18);touch-action:pan-x}
.stage>img.bg{position:absolute;inset:0;width:100%;height:100%;max-width:none;display:block;user-select:none;-webkit-user-drag:none}
.sp{position:absolute;max-width:none;will-change:transform;cursor:pointer;user-select:none;-webkit-user-drag:none;-webkit-tap-highlight-color:transparent;transform-origin:50% 60%}
.sp.boing{animation:boing .7s ease-out}
@keyframes boing{0%{scale:1}25%{scale:1.15 .88}50%{scale:.92 1.1}75%{scale:1.05 .97}100%{scale:1}}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button{font:inherit;font-weight:700;border:1.5px solid var(--accent);color:var(--accent);background:var(--chip);border-radius:999px;padding:.5em 1.1em;cursor:pointer}
button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hint{color:var(--muted);font-size:.85rem}
.snd{display:inline-flex;align-items:center;gap:.5em;font-weight:700;color:var(--accent);border:1.5px solid var(--accent);background:var(--chip);border-radius:999px;padding:.5em 1.1em;cursor:pointer;user-select:none}
.snd input{accent-color:var(--accent);width:1.1em;height:1.1em;margin:0;cursor:pointer}
.snd:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
@media (min-width:900px){.hint.mob{display:none}}
</style>

</head>
<body>
<div class="wrap">
  <div>
    <h1>カブトガニの海</h1>
    <p class="sub">いきものをタップすると、ぴょこっと はねてから うごきだします。もういちどタップすると とまります。</p>
  </div>
  <div class="scroller" id="scroller"><div class="stage" id="stage"></div></div>
  <div class="bar">
    <button id="all">みんな うごかす</button>
    <button id="stop">みんな とめる</button>
    <button id="slow" aria-pressed="true">ゆっくり</button>
    <button id="norm" aria-pressed="false">ふつう</button>
    <label class="snd"><input type="checkbox" id="mute"><span>🔇 おとを けす</span></label>
    <span class="hint">なみのおとは さいしょに タップすると ながれます</span>
    <span class="hint mob">← 横にスクロールすると全体が見られます →</span>
  </div>
</div>

<script>
(function(){
  const stage=document.getElementById('stage');
  const W=ART.W,H=ART.H;
  const bg=new Image();bg.className='bg';bg.src=ART.bg;bg.alt='子どもたちが描いたカブトガニやカニの海の絵';stage.appendChild(bg);

  // motion: dx/dy = travel in drawing pixels, p = seconds per lap, r = sway degrees, z = layer
  // crab:true adds a quick scuttle; spin = slow full turns (seconds per turn)
  const M={
    tl:{dx:20,dy:20,p:30,r:4,z:1},
    jelly:{dx:15,dy:30,p:12,r:4,z:1},
    urchin:{dx:20,dy:12,p:30,r:0,spin:60,z:1},
    topHC:{dx:90,dy:12,p:28,r:3,z:2},
    ring:{dx:30,dy:25,p:30,r:6,z:2},
    robot:{dx:20,dy:15,p:10,r:8,z:2},
    bird:{dx:120,dy:20,p:20,r:5,z:2},
    shadow:{dx:100,dy:10,p:22,r:3,z:2},
    worm:{dx:70,dy:10,p:18,r:3,z:2},
    spiny:{dx:40,dy:20,p:16,r:6,crab:true,z:2},
    helmet:{dx:25,dy:40,p:30,r:4,z:3},
    turtle:{dx:35,dy:45,p:32,r:3,z:3},
    greenL:{dx:25,dy:25,p:28,r:3,z:3},
    bigR:{dx:40,dy:25,p:34,r:3,z:3},
    brR:{dx:35,dy:15,p:28,r:3,z:3},
    blob:{dx:70,dy:15,p:26,r:3,z:3},
    crabsL:{dx:45,dy:6,p:12,r:3,crab:true,z:1},
    fish:{dx:150,dy:22,p:20,r:5,z:2},
    rainbow:{dx:80,dy:28,p:15,r:6,z:2},
    orange:{dx:14,dy:55,p:24,r:4,z:2},
    green:{dx:85,dy:28,p:26,r:5,z:3},
    crabE:{dx:40,dy:10,p:9,r:6,crab:true,z:3},
    crabA:{dx:60,dy:8,p:11,r:5,crab:true,z:3},
    crabC:{dx:45,dy:12,p:8,r:7,crab:true,z:3},
    crabD:{dx:55,dy:10,p:10,r:6,crab:true,z:3},
    crabB:{dx:50,dy:8,p:12,r:6,crab:true,z:3},
    crabF:{dx:65,dy:14,p:13,r:5,crab:true,z:3},
    crabG:{dx:45,dy:10,p:9,r:7,crab:true,z:3},
    yellow:{dx:110,dy:18,p:32,r:3,z:4},
    blue:{dx:120,dy:8,p:36,r:2,z:5}
  };
  const items=[];
  Object.keys(M).forEach((k,i)=>{
    const s=ART.sprites[k];if(!s)return;
    const el=new Image();el.className='sp';el.src=s.src;el.alt='';el.draggable=false;
    el.style.left=(s.x/W*100)+'%';el.style.top=(s.y/H*100)+'%';
    el.style.width=(s.w/W*100)+'%';el.style.zIndex=M[k].z;
    // each animal keeps its own clock (t) and strength (amp, 0 = resting at home, 1 = full walk)
    const it={el,m:M[k],ph:(i%2?-1:1),t:0,amp:0,target:0,wait:0};
    el.addEventListener('pointerdown',()=>{
      el.classList.remove('boing');void el.offsetWidth;el.classList.add('boing');
      if(it.target){it.target=0;}            // moving -> settle back home
      else{it.wait=.7;}                      // still -> start after the bounce
    });
    stage.appendChild(el);
    items.push(it);
  });

  let speed=1,last=performance.now();
  function frame(now){
    const dt=Math.min(.1,(now-last)/1000);last=now;
    const sw=stage.clientWidth/W; // drawing px -> screen px
    for(const it of items){
      if(it.wait>0){it.wait-=dt;if(it.wait<=0)it.target=1;}
      it.amp+=(it.target-it.amp)*Math.min(1,dt*(it.target?0.6:1.2));   // ease in / ease out
      if(it.amp<0.002&&!it.target){it.amp=0;it.t=0;}
      if(it.amp>0)it.t+=dt*speed;
      const m=it.m,t=it.t,a=it.ph*2*Math.PI*t/m.p;
      let x=Math.sin(a)*m.dx, y=Math.sin(2*a)*m.dy*.5, r=Math.sin(a*1.3)*m.r;
      if(m.crab){x+=Math.sin(t*7)*3; r+=Math.sin(t*9)*m.r*.6;}
      if(m.spin)r+=t/m.spin*360;
      x*=it.amp;y*=it.amp;r*=it.amp;
      it.el.style.transform=`translate(${(x*sw).toFixed(1)}px,${(y*sw).toFixed(1)}px) rotate(${r.toFixed(2)}deg)`;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  const slow=document.getElementById('slow'),norm=document.getElementById('norm');
  document.getElementById('all').onclick=()=>items.forEach((it,i)=>{if(!it.target&&it.wait<=0)it.wait=0.15*i;});
  document.getElementById('stop').onclick=()=>items.forEach(it=>{it.target=0;it.wait=0;});
  slow.onclick=()=>{speed=1;slow.setAttribute('aria-pressed','true');norm.setAttribute('aria-pressed','false');};
  norm.onclick=()=>{speed=2.2;norm.setAttribute('aria-pressed','true');slow.setAttribute('aria-pressed','false');};
})();
</script>


<script>
// Small synthesized waves (no audio file). Sound is ON by default; browsers only allow it after the first tap/click.
(function(){
  const mute=document.getElementById('mute');
  let ctx=null,master=null;
  try{if(localStorage.getItem('kabuto-mute')==='1')mute.checked=true;}catch(e){}
  function layer(noise,period,base,span,lfoPhase){
    const src=ctx.createBufferSource();src.buffer=noise;src.loop=true;
    const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=base;lp.Q.value=.4;
    const g=ctx.createGain();g.gain.value=.45;
    const o1=ctx.createOscillator(),o2=ctx.createOscillator();o1.frequency.value=1/period;o2.frequency.value=1/period;
    const d1=ctx.createGain(),d2=ctx.createGain();d1.gain.value=span;d2.gain.value=.4;
    o1.connect(d1).connect(lp.frequency);o2.connect(d2).connect(g.gain);
    src.connect(lp).connect(g).connect(master);
    src.start(0,Math.random()*2);o1.start(ctx.currentTime+lfoPhase);o2.start(ctx.currentTime+lfoPhase);
  }
  function build(){
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    ctx=new AC();master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);
    const n=ctx.createBuffer(1,ctx.sampleRate*3,ctx.sampleRate),d=n.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    layer(n,8.3,450,300,0);
    layer(n,12.1,700,400,1.7);
  }
  function apply(){if(ctx)master.gain.setTargetAtTime(mute.checked?0:.22,ctx.currentTime,.4);}
  function start(){if(!ctx)build();if(!ctx)return;if(ctx.state==='suspended')ctx.resume();apply();}
  const evs=['pointerdown','keydown','touchend'];
  function first(){if(mute.checked)return;start();evs.forEach(e=>removeEventListener(e,first,true));}
  evs.forEach(e=>addEventListener(e,first,true));
  mute.addEventListener('change',()=>{
    try{localStorage.setItem('kabuto-mute',mute.checked?'1':'0');}catch(e){}
    if(mute.checked)apply();else start();
  });
  document.addEventListener('visibilitychange',()=>{
    if(!ctx)return;
    if(document.hidden)ctx.suspend();else if(!mute.checked)ctx.resume();
  });
})();
</script></body>
</html>
